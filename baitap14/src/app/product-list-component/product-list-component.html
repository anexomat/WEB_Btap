<p>product-list-component works!</p>
<table border="1">
  <ng-container *ngFor="let category of products">
    <tr>
      <td colspan="4">{{ category.Cateid }} — {{ category.CateName }}</td>
    </tr>
    <tr>
      <td>Ma San Pham</td>
      <td>Ten San Pham</td>
      <td>Gia San Pham</td>
      <td>Picture</td>
    </tr>
    <tr *ngFor="let product of category.Products">
      <td>{{ product.ProductId }}</td>
      <td>{{ product.ProductName }}</td>
      <td>{{ product.Price }}</td>
      <td><img [src]="product.Image" [alt]="product.ProductName" width="50"></td>
    </tr>
  </ng-container>
</table>
